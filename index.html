<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claudi Ferreira</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Claudi Ferreira — artes da cena, iluminação, som, produção cultural, CRM e desenvolvimento web.">
<meta property="og:type" content="website">
<meta property="og:title" content="Claudi Ferreira">
<meta property="og:description" content="Artes da cena · Comunicação e tecnologia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#trabalhos">Ir para os trabalhos</a>

<header class="hdr">
  <a class="hdr-name" href="?">Claudi Ferreira</a>
  <nav class="ctrls" aria-label="Seletor de área e idioma">
    <div class="seg" id="segArea" role="group" aria-label="Área"></div>
    <div class="seg seg-lang" id="segLang" role="group" aria-label="Idioma"></div>
  </nav>
</header>

<main>
  <section class="hero">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="headline" id="headline"></h1>
    <p class="lede" id="lede"></p>
    <ul class="stats" id="stats"></ul>
  </section>

  <section id="trabalhos" class="sec">
    <h2 class="sec-t" id="tWorks"></h2>
    <div class="grid" id="grid"></div>
  </section>

  <section class="sec sec-two">
    <div>
      <h2 class="sec-t" id="tAbout"></h2>
      <div class="prose" id="bio"></div>
    </div>
    <div>
      <h2 class="sec-t" id="tTools"></h2>
      <ul class="chips" id="tools"></ul>
      <h2 class="sec-t mt" id="tEdu"></h2>
      <ul class="edu" id="edu"></ul>
    </div>
  </section>

  <section class="sec contact">
    <h2 class="sec-t" id="tContact"></h2>
    <div class="contact-grid">
      <div id="contactLinks"></div>
      <div class="share">
        <p class="share-l" id="shareLabel"></p>
        <div class="share-row">
          <code id="shareUrl"></code>
          <button class="btn-copy" id="btnCopy" type="button"></button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="ftr"><span id="ftrTxt"></span></footer>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-bd" data-close></div>
  <article class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <button class="drawer-x" id="drawerX" type="button" aria-label="Fechar">×</button>
    <div id="drawerBody"></div>
  </article>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
